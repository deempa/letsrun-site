<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<title>בוא נרוץ</title>
<meta name="apple-itunes-app" content="app-id=6820719707">
<!-- Shared links land here: GitHub Pages serves this page for any unknown path, so /c/<token> (a personal
     connection link) and /r/<run id> (a shared run) are read from the address and handed to the app. -->
<meta name="description" content="הוזמנת לבוא נרוץ — ריצות קבוצתיות בשכונה, בקצב שלך.">
<meta property="og:title" content="בוא נרוץ">
<meta property="og:description" content="הוזמנת לרוץ ביחד. פותחים את האפליקציה ומצטרפים.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://letsrun.co.il/img/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="בוא נרוץ">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap">
<style>
  :root { --bg:#FFFFFF; --surface:#F5F5F2; --hairline:#EAEAE6; --ink:#0E0E0E; --muted:#6B6B70; --volt:#D4FF3F; color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Heebo","Arial Hebrew",system-ui,sans-serif;
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 16px; }
  main { width:100%; max-width:420px; text-align:center; }
  .mark { width:56px; height:56px; margin:0 auto 28px; position:relative; }
  .mark::before { content:""; position:absolute; inset:0 18px 0 0; border-radius:50%; background:var(--volt); }
  .mark::after { content:""; position:absolute; inset:0 0 0 18px; border-radius:50%; border:5px solid var(--ink); }
  h1 { font-size:1.75rem; font-weight:800; margin:0 0 10px; letter-spacing:-0.02em; }
  p { color:var(--muted); font-size:1.0625rem; line-height:1.55; margin:0 0 28px; }
  .btn { display:flex; align-items:center; justify-content:center; height:56px; border-radius:999px; font-weight:700;
         font-size:1.0625rem; text-decoration:none; margin-bottom:12px; }
  .primary { background:var(--ink); color:var(--bg); }
  .ghost { background:var(--surface); color:var(--ink); }
  .note { font-size:0.875rem; margin-top:20px; }
  a.home { color:var(--muted); font-size:0.875rem; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true"></div>
  <h1 id="title">בוא נרוץ</h1>
  <p id="lead">הדף שחיפשת לא נמצא.</p>
  <a class="btn primary" id="open" href="#" hidden>פתיחה באפליקציה</a>
  <a class="btn ghost" id="ios" href="https://apps.apple.com/il/app/id6820719707" rel="noopener" hidden>אין לך את האפליקציה? הורדה לאייפון</a>
  <p class="note" id="android" hidden>באנדרואיד — בקרוב ב-Google Play.</p>
  <a class="home" id="home" href="./">לדף הבית של בוא נרוץ</a>
</main>
<script>
(function () {
  // Works both at the domain root (letsrun.co.il) and under a project path (…github.io/letsrun-site).
  // Accepted forms: /c/<token>, /r/<id> (served by 404.html) and /c/?t=<token>, /r/?id=<id> (real pages, so link
  // previews get a 200).
  var path = location.pathname, q = new URLSearchParams(location.search);
  var m = path.match(/\/(c|r|g)\/([A-Za-z0-9_-]{6,64})\/?$/);
  var kind = m ? m[1] : null, id = m ? m[2] : null;
  if (!m) {
    var k = path.match(/\/(c|r|g)\/(index\.html)?$/);
    var v = k && (q.get('t') || q.get('id'));
    if (k && v && /^[A-Za-z0-9_-]{6,64}$/.test(v)) { kind = k[1]; id = v; }
  }
  var base = path.replace(/\/(c|r|g)\/[^/]*$/, '/').replace(/\/404\.html$/, '/');
  document.getElementById('home').href = base;
  if (!kind) return;
  var app = 'letsrun://' + kind + '/' + id;
  var texts = {
    c: ['בוא נרוץ — בקשת חיבור', 'בואו נתחבר בבוא נרוץ', 'פותחים את האפליקציה ושולחים בקשת חיבור. החיבור נוצר רק אחרי ששני הצדדים מאשרים.'],
    r: ['בוא נרוץ — הוזמנת לריצה', 'הוזמנת לריצה', 'פותחים את האפליקציה כדי לראות את הריצה ולהצטרף.'],
    g: ['בוא נרוץ — הוזמנת לקבוצה', 'הוזמנת לקבוצת ריצה', 'פותחים את האפליקציה כדי להצטרף לקבוצה ולרוץ יחד קבוע.']
  }[kind];
  document.title = texts[0];
  document.getElementById('title').textContent = texts[1];
  document.getElementById('lead').textContent = texts[2];
  var open = document.getElementById('open');
  open.href = app; open.hidden = false;
  document.getElementById('ios').hidden = false;
  document.getElementById('android').hidden = false;
  // On phones, try the app right away; if it isn't installed the page simply stays.
  if (/iPhone|iPad|Android/i.test(navigator.userAgent)) {
    setTimeout(function () { location.href = app; }, 350);
  }
})();
</script>
</body>
</html>
