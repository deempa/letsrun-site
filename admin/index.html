<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<title>ניהול · בוא נרוץ</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://hpzekzgcexjuychyobxt.supabase.co; connect-src https://hpzekzgcexjuychyobxt.supabase.co wss://hpzekzgcexjuychyobxt.supabase.co; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#0E0E0E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap">
<!-- ?v= changes with every release of admin.css / admin.js: GitHub Pages lets browsers cache them for 10 minutes, and an
     old file next to a new page breaks it. -->
<link rel="stylesheet" href="admin.css?v=41">
<!-- supabase-js, pinned (the file the jsDelivr path names never changes; the hash below checks it). -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"
        integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o"
        crossorigin="anonymous" defer></script>
<script src="admin.js?v=44" defer></script>
</head>
<body>
<!-- Admin page for בוא נרוץ (round 24; round 38: sketch B on a phone; round 58: direction B, a top bar and tiles). Not linked from the
     site. Everything it shows or changes goes through admin_* RPCs that the database allows only for the accounts in
     private.admins. -->
<div class="shell">
  <!-- Computer: the ink top bar (round 58, direction B): the sections, search and what waits. -->
  <header class="side" id="side" aria-label="ניהול" hidden>
    <a class="side-brand" href="#overview">
      <span class="logo" aria-hidden="true"><span class="logo-fill"></span><span class="logo-ring"></span></span>
      <b class="side-title">ניהול</b>
    </a>
    <nav class="side-nav" aria-label="מדורים">
      <a href="#overview" data-nav="overview">מבט על</a>
      <a href="#users" data-nav="users">משתמשים</a>
      <a href="#runs" data-nav="runs">ריצות</a>
      <a href="#groups" data-nav="groups">קבוצות</a>
      <a href="#offers" data-nav="offers">הטבות</a>
      <a href="#races" data-nav="races">מרוצים</a>
      <a href="#system" data-nav="system">מערכת</a>
    </nav>
    <div class="side-end">
      <button type="button" class="side-search" data-search aria-label="חיפוש (⌘K)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zM20 20l-4-4"/></svg>
        <kbd dir="ltr">⌘K</kbd>
      </button>
      <a href="#inbox" data-nav="inbox" class="todo-pill">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13l2.5-8h11L20 13v6H4zM4 13h4.5l1 2.5h5l1-2.5H20"/></svg>
        <span data-todo-label>משימות</span>
      </a>
    </div>
  </header>

  <div class="main">
    <!-- Phone: the ink top bar (sign-in screens show it too). -->
    <header class="bar" id="bar">
      <span class="logo" aria-hidden="true"><span class="logo-fill"></span><span class="logo-ring"></span></span>
      <b class="bar-title">ניהול</b>
      <button type="button" class="bar-icon" data-search aria-label="חיפוש" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zM20 20l-4-4"/></svg>
      </button>
      <button type="button" class="bar-out" id="sign-out" data-sign-out hidden>יציאה</button>
    </header>

    <main id="view" class="view" tabindex="-1" aria-live="polite">
      <p class="loading"><span class="dot" aria-hidden="true"></span>טוענים…</p>
    </main>
  </div>

  <!-- Phone: the bottom tabs (sketch B). -->
  <nav class="tabbar" id="tabbar" aria-label="מדורים" hidden>
    <a href="#overview" data-nav="overview">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-3H4zM14 7h6V4h-6z"/></svg>
      <span>מבט על</span></a>
    <a href="#inbox" data-nav="inbox">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13l2.5-8h11L20 13v6H4zM4 13h4.5l1 2.5h5l1-2.5H20"/></svg>
      <span>משימות</span><span class="count" data-count hidden></span></a>
    <a href="#users" data-nav="users">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5M16 4.8a3.3 3.3 0 0 1 0 6.4M18.5 14.8c1.6.8 2.6 2.5 3 5.2"/></svg>
      <span>משתמשים</span></a>
    <a href="#groups" data-nav="groups">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 10a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM16 10a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM3 20c.6-3.2 2.6-5 5-5s4.4 1.8 5 5M11 20c.6-3.2 2.6-5 5-5s4.4 1.8 5 5"/></svg>
      <span>קבוצות</span></a>
    <a href="#more" data-nav="more">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg>
      <span>עוד</span></a>
  </nav>
</div>

<!-- Sign-in: an email one-time code. -->
<template id="t-signin">
  <section class="panel signin">
    <h1>כניסה לניהול</h1>
    <p class="muted">שולחים קוד חד-פעמי למייל של חשבון מנהל.</p>
    <form class="stack" id="email-form" novalidate>
      <label class="field">
        <span class="label">אימייל</span>
        <input type="email" name="email" id="email" autocomplete="email" inputmode="email" dir="ltr" required>
      </label>
      <button type="submit" class="btn ink">שליחת קוד</button>
      <p class="form-error" id="email-error" role="alert" hidden></p>
    </form>
  </section>
</template>

<template id="t-code">
  <section class="panel signin">
    <h1>מה הקוד?</h1>
    <p class="muted">שלחנו מייל אל <b id="code-email" dir="ltr"></b> עם קוד בן 6 ספרות או קישור כניסה. אם יש קוד, הקלידו אותו כאן; אם יש קישור, לחצו עליו. הוא בתוקף לזמן קצר.</p>
    <form class="stack" id="code-form" novalidate>
      <label class="field">
        <span class="label">קוד</span>
        <input type="text" name="code" id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}"
               maxlength="6" dir="ltr" class="code-input" required>
      </label>
      <button type="submit" class="btn ink">כניסה</button>
      <p class="form-error" id="code-error" role="alert" hidden></p>
    </form>
    <div class="row-links">
      <button type="button" class="btn text" id="resend">שליחה מחדש</button>
      <button type="button" class="btn text" id="other-email">כתובת אחרת</button>
    </div>
  </section>
</template>

<!-- Second step (round 30): a code from an authenticator app. The database refuses admin_* calls without it. -->
<template id="t-mfa-enroll">
  <section class="panel signin">
    <span class="step-label">שלב 2 מתוך 2</span>
    <h1>עוד מנעול אחד</h1>
    <p class="muted">כאן רואים מיילים של משתמשים, אז הכניסה צריכה גם קוד מאפליקציית אימות בטלפון (Google Authenticator, 1Password וכדומה).</p>
    <div class="mfa-setup">
      <img class="mfa-qr" id="mfa-qr" alt="קוד QR לסריקה באפליקציית האימות" width="140" height="140">
      <div class="mfa-key">
        <b>1. סורקים באפליקציה</b>
        <span class="muted">או מקלידים את המפתח:</span>
        <code id="mfa-secret" dir="ltr"></code>
      </div>
    </div>
    <form class="stack" id="mfa-enroll-form" novalidate>
      <label class="field">
        <span class="label">2. מקלידים את הקוד שמופיע שם</span>
        <input type="text" id="mfa-enroll-code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}"
               maxlength="6" dir="ltr" class="code-input" required>
      </label>
      <button type="submit" class="btn ink">הפעלה וכניסה</button>
      <p class="form-error" id="mfa-enroll-error" role="alert" hidden></p>
    </form>
    <p class="note">טלפון אבד? אפשר לאפס מ־Supabase (מתועד ב־README).</p>
  </section>
</template>

<template id="t-mfa">
  <section class="panel signin">
    <h1>הקוד מאפליקציית האימות</h1>
    <p class="muted">אחרי הקוד מהמייל, עוד 6 ספרות מהטלפון.</p>
    <form class="stack" id="mfa-form" novalidate>
      <label class="field">
        <span class="label">קוד אימות</span>
        <input type="text" id="mfa-code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}"
               maxlength="6" dir="ltr" class="code-input" required>
      </label>
      <button type="submit" class="btn ink">כניסה</button>
      <p class="form-error" id="mfa-error" role="alert" hidden></p>
    </form>
  </section>
</template>

<template id="t-denied">
  <section class="panel signin">
    <h1>אין הרשאה</h1>
    <p class="muted">החשבון הזה לא מוגדר כמנהל. אפשר לצאת ולהיכנס עם חשבון אחר.</p>
    <button type="button" class="btn ink" id="denied-out">יציאה</button>
  </section>
</template>

<!-- Asks for a short note before an action runs (suspension, removal, closing, a reviewed flag). -->
<dialog id="confirm" class="sheet" aria-labelledby="confirm-title">
  <form class="stack" id="confirm-form" novalidate>
    <h2 id="confirm-title"></h2>
    <p class="muted" id="confirm-text"></p>
    <label class="field">
      <span class="label" id="confirm-label"></span>
      <textarea id="confirm-note" rows="3" maxlength="500"></textarea>
    </label>
    <p class="form-error" id="confirm-error" role="alert" hidden></p>
    <div class="actions">
      <button type="submit" class="btn ink" id="confirm-ok" value="ok"></button>
      <button type="button" class="btn text" id="confirm-cancel">ביטול</button>
    </div>
  </form>
</dialog>

<!-- A yes / no question (round 57: publishing an offer with a push). -->
<dialog id="ask" class="sheet" aria-labelledby="ask-title">
  <form class="stack" id="ask-form" novalidate>
    <h2 id="ask-title"></h2>
    <p class="muted" id="ask-text"></p>
    <div class="actions">
      <button type="submit" class="btn ink" id="ask-ok" value="ok"></button>
      <button type="button" class="btn text" id="ask-cancel">ביטול</button>
    </div>
  </form>
</dialog>

<!-- Deleting an account (round 38): what goes, what stays, a reason, and the word "מחיקה". -->
<dialog id="delete" class="sheet wide" aria-labelledby="delete-title">
  <form class="stack" id="delete-form" novalidate>
    <div class="dlg-head">
      <span class="dlg-icon danger" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>
      </span>
      <div class="dlg-head-text">
        <h2 id="delete-title"></h2>
        <p class="muted">זה בלתי הפיך, כמו מחיקה שהמשתמש/ת עושה בעצמו/ה מהאפליקציה.</p>
      </div>
    </div>
    <div class="impact">
      <div><b class="impact-gone">יימחק</b><ul id="delete-gone"></ul></div>
      <div><b class="impact-kept">נשמר</b><ul id="delete-kept"></ul></div>
    </div>
    <div class="suggest" id="delete-suggest">
      <span>רוצה רק לעצור? השעיה הפיכה.</span>
      <button type="button" class="btn text" id="delete-suspend">השעיה במקום</button>
    </div>
    <label class="field">
      <span class="label">סיבה (חובה, נשמרת ביומן)</span>
      <textarea id="delete-reason" rows="2" maxlength="500" required></textarea>
    </label>
    <label class="field">
      <span class="label">כדי לאשר, מקלידים: <b>מחיקה</b></span>
      <input type="text" id="delete-word" autocomplete="off" spellcheck="false" required>
    </label>
    <p class="form-error" id="delete-error" role="alert" hidden></p>
    <div class="actions">
      <button type="submit" class="btn danger" id="delete-ok" disabled>מחיקה לצמיתות</button>
      <button type="button" class="btn text" id="delete-cancel">ביטול</button>
    </div>
  </form>
</dialog>

<!-- Quick search (⌘K): people and runs. -->
<dialog id="finder" class="sheet finder" aria-label="חיפוש מהיר">
  <div class="finder-box">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zM20 20l-4-4"/></svg>
    <input type="search" id="finder-input" placeholder="שם, מייל, מזהה או ריצה" aria-label="חיפוש משתמש או ריצה"
           autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="finder-list"
           aria-autocomplete="list">
    <kbd>Esc</kbd>
  </div>
  <div class="finder-list" id="finder-list" role="listbox" aria-label="תוצאות"></div>
  <p class="finder-hint" id="finder-hint">לפחות 2 אותיות. ↑ ↓ לבחירה, Enter לפתיחה.</p>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite" hidden>
  <span id="toast-text"></span>
  <button type="button" class="toast-action" id="toast-action" hidden></button>
</div>
</body>
</html>
