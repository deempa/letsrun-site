<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>בוא נרוץ</title>
<meta property="og:title" content="בוא נרוץ">
<meta property="og:description" content="רצים ביחד בשכונה. ריצות קבוצתיות ליד הבית, בקצב שלך.">
<meta property="og:type" content="website">
<link rel="canonical" href="https://letsrun.co.il/">
<meta name="description" content="רצים ביחד, בשכונה. ריצות קבוצתיות ליד הבית, בקצב שלך.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Nunito:wght@800;900&display=swap">
<style>
:root{--ink:#0E0E0E;--volt:#D4FF3F;--surface:#F5F5F2;--muted:#6E6E73;--hair:#ECECE7;--gutter:64px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:var(--ink);font-family:Heebo,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1312px;margin:0 auto;padding:0 var(--gutter)}

/* header */
.top{padding-top:36px}
.brand{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.3px;text-decoration:none}
.brand svg{display:block}

/* hero */
.hero{display:grid;grid-template-columns:1fr 600px;align-items:center;gap:48px;padding:72px 0 0}
h1{margin:0;font-size:104px;line-height:.98;font-weight:800;letter-spacing:-4px}
.dot{display:inline-block;width:.17em;height:.17em;border-radius:50%;background:var(--volt);box-shadow:0 0 0 .035em var(--ink);margin-inline-start:.06em;vertical-align:baseline}
.lede{margin:32px 0 0;font-size:22px;line-height:1.5;color:var(--muted);font-weight:400}
.stores{display:flex;gap:12px;margin-top:48px;flex-wrap:wrap}
.store{display:inline-flex;align-items:center;gap:12px;height:60px;padding:0 24px 0 26px;border-radius:999px;text-decoration:none;white-space:nowrap}
.store small{display:block;font-size:12px;line-height:1.1;font-weight:500;opacity:.7}
.store b{display:block;font-size:18px;line-height:1.2;font-weight:700}
.store.ios{background:var(--ink);color:#fff}
.store.ios:hover{background:#000}
.store.play{background:var(--surface);color:var(--muted)}

/* phone */
.stage{position:relative;display:flex;justify-content:center;align-items:center;padding:24px 0}
.stage::before{content:"";position:absolute;width:560px;height:560px;border-radius:50%;background:var(--surface);top:50%;left:50%;transform:translate(-50%,-50%)}
.phone{position:relative;width:318px;padding:10px;border-radius:58px;background:var(--ink);box-shadow:0 50px 90px -40px rgba(14,14,14,.45),inset 0 0 0 1.5px #2a2a2a}
.phone img{display:block;width:100%;height:auto;border-radius:48px}
.phone::after{content:"";position:absolute;top:22px;left:50%;width:92px;height:27px;margin-left:-46px;border-radius:20px;background:var(--ink)}

/* footer */
footer{margin-top:176px;border-top:1px solid var(--hair)}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:24px;padding-top:32px;padding-bottom:40px;font-size:14px;color:var(--muted)}
footer nav{display:flex;gap:28px;flex-wrap:wrap}
footer a{text-decoration:none}
footer a:hover{color:var(--ink)}
.num{font-family:Nunito,Heebo,sans-serif;font-weight:800}

@media (max-width:820px){
  :root{--gutter:20px}
  .top{padding-top:22px}
  .hero{grid-template-columns:1fr;gap:0;padding-top:64px}
  h1{font-size:58px;letter-spacing:-2px}
  .lede{font-size:18px;margin-top:20px}
  .stores{flex-wrap:nowrap;gap:10px;margin-top:36px}
  .store{flex:1;justify-content:center;height:56px;padding:0 12px;gap:10px}
  .store b{font-size:16px}
  .stage{margin-top:72px;padding:0}
  .stage::before{width:340px;height:340px}
  .phone{width:262px;padding:8px;border-radius:48px}
  .phone img{border-radius:40px}
  .phone::after{top:17px;width:76px;height:22px;margin-left:-38px}
  footer{margin-top:96px}
  footer .wrap{flex-direction:column-reverse;align-items:flex-start;gap:16px;padding-top:28px}
  footer nav{gap:20px}
}
</style>
</head>
<body>

<header class="top wrap">
  <a class="brand" href="#" aria-label="בוא נרוץ">
    <svg width="36" height="26" viewBox="0 0 36 26" aria-hidden="true"><circle cx="23" cy="13" r="11.5" fill="#D4FF3F"/><circle cx="13" cy="13" r="10" fill="none" stroke="#0E0E0E" stroke-width="3"/></svg>
    בוא נרוץ
  </a>
</header>

<main class="wrap">
  <section class="hero">
    <div>
      <h1>רצים ביחד<br>בשכונה<span class="dot" aria-hidden="true"></span></h1>
      <p class="lede">ריצות קבוצתיות ליד הבית, בקצב שלך.</p>
      <div class="stores">
        <a class="store ios" href="https://testflight.apple.com/join/U2SmA9NM" rel="noopener">
          <svg width="20" height="24" viewBox="0 0 22 26" aria-hidden="true"><path fill="currentColor" d="M18.2 13.8c0-2.9 2.4-4.3 2.5-4.4-1.4-2-3.5-2.3-4.3-2.3-1.8-.2-3.6 1.1-4.5 1.1-.9 0-2.4-1.1-3.9-1-2 0-3.9 1.2-4.9 3-2.1 3.7-.5 9.1 1.5 12.1 1 1.5 2.2 3.1 3.7 3 1.5-.1 2.1-1 3.9-1s2.3 1 3.9.9c1.6 0 2.6-1.5 3.6-3 1.1-1.7 1.6-3.4 1.6-3.5-.1 0-3.1-1.2-3.1-4.9zM15.3 5.1c.8-1 1.4-2.4 1.2-3.8-1.2.1-2.6.8-3.4 1.8-.8.9-1.4 2.3-1.2 3.7 1.3.1 2.6-.7 3.4-1.7z"/></svg>
          <span><small>בטא לאייפון</small><b>TestFlight</b></span>
        </a>
        <span class="store play" aria-label="Google Play, בקרוב">
          <svg width="20" height="22" viewBox="0 0 22 24" aria-hidden="true"><path fill="currentColor" d="M1.2.6C.9.9.7 1.4.7 2v20c0 .6.2 1.1.5 1.4l11.2-11.4L1.2.6zm12.4 12.6l3.3 3.4-14 8c-.4.2-.8.3-1.1.2l11.8-11.6zm0-2.4L1.8-.2c.3-.1.7 0 1.1.2l14 8-3.3 2.8zm4.4 4.9L14.5 12l3.5-3.6 3.6 2c1 .6 1 1.6 0 2.2l-3.6 2.1z"/></svg>
          <span><small>בקרוב ב-</small><b>Google Play</b></span>
        </span>
      </div>
    </div>
    <div class="stage">
      <div class="phone"><img src="img/app-feed.jpg" width="662" height="1440" alt="מסך הבית באפליקציה: ריצה של 4 ק״מ בגן מאיר שיצאה לפני 12 דקות, על תמונה של הפארק"></div>
    </div>
  </section>

</main>

<footer>
  <div class="wrap">

    <nav aria-label="קישורים">

</body>
</html>
